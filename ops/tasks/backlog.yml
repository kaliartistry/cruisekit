tasks:
  - id: phase1-001
    title: Keep GrowthOps branch hygiene and preflight/postflight checks mandatory
    phase: "Phase 1: Foundation and repo control"
    priority: high
    status: completed
    allowed_auto: true
    approval_required: false
    risk_level: low
    target_files:
      - AGENTS.md
      - docs/growthops-github-handoff.md
      - ops/scripts/preflight-audit.js
      - ops/scripts/postflight-audit.js
    preflight_required: true
    postflight_required: true
    acceptance_criteria:
      - Automation refuses to operate from OneDrive, Documents, Desktop, or main.
      - Preflight and postflight outputs are captured in ops reports.
      - Approval triggers are documented before PR creation.
  - id: phase1-002
    title: Validate public-safe GrowthOps reporting boundaries
    phase: "Phase 1: Foundation and repo control"
    priority: high
    status: ready
    allowed_auto: true
    approval_required: false
    risk_level: low
    target_files:
      - ops/prompts/system.md
      - ops/tasks/approval_queue.yml
    preflight_required: true
    postflight_required: true
    acceptance_criteria:
      - Reports avoid private strategy, secrets, sensitive financial notes, legal notes, and user data.
      - Approval queue includes any private-repo or separate-ops-repo decision.
