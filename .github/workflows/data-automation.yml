name: CruiseKit Data Automation

on:
  workflow_dispatch:
    inputs:
      job:
        description: "Automation job to run"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - daily
          - publish-candidate
          - weekly-ingest
          - launch-readiness
          - monthly-coverage
  schedule:
    # Daily data health, link, image, and manual-review reports.
    - cron: "21 10 * * *"
    # Guarded publish-candidate report, no commit or deploy.
    - cron: "17 13 * * 1,3,5"
    # Weekly report-only cruise-line ingest pass.
    - cron: "34 11 * * 1"
    # Weekly live website launch-readiness check.
    - cron: "43 14 * * 5"
    # Monthly cruise-line coverage report.
    - cron: "47 12 1 * *"

permissions:
  contents: read
  issues: write

concurrency:
  group: cruisekit-data-automation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  daily:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.job == 'all' || github.event.inputs.job == 'daily')) ||
      github.event.schedule == '21 10 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Run daily data automation
        run: pnpm run data:automation:daily
        env:
          CRUISEKIT_REPORT_ONLY: "1"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cruisekit-daily-data-reports
          path: data/reports/

  publish-candidate:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.job == 'all' || github.event.inputs.job == 'publish-candidate')) ||
      github.event.schedule == '17 13 * * 1,3,5'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Run guarded publish-candidate report
        run: pnpm run data:publish:candidate
        env:
          CRUISEKIT_REPORT_ONLY: "1"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cruisekit-publish-candidate
          if-no-files-found: warn
          path: |
            data/reports/latest-publish-candidate.*
            data/reports/latest-data-health.*
            data/reports/latest-data-freshness.*
            data/reports/latest-link-audit.*
            data/reports/latest-image-audit.*
            apps/web/public/data/bundles/manifest.json

  weekly-ingest:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.job == 'all' || github.event.inputs.job == 'weekly-ingest')) ||
      github.event.schedule == '34 11 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browser
        run: pnpm exec playwright install chromium
      - name: Run weekly ingest and review report-only pass
        run: pnpm run data:ingest:weekly-report
      - name: Run weekly production freshness gate
        id: freshness
        continue-on-error: true
        run: pnpm run data:build && pnpm run data:freshness
      - name: Create or update data freshness issue
        if: steps.freshness.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/create-data-freshness-issue.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cruisekit-weekly-ingest-reports
          path: |
            data/reports/
            data/ingest/reports/
      - name: Fail when production data is stale
        if: steps.freshness.outcome == 'failure'
        run: exit 1

  launch-readiness:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.job == 'all' || github.event.inputs.job == 'launch-readiness')) ||
      github.event.schedule == '43 14 * * 5'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Prepare local data bundle signature
        run: pnpm run data:build && node scripts/publish-data-bundles.mjs
      - name: Run live launch-readiness check
        run: pnpm run site:readiness
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cruisekit-launch-readiness
          if-no-files-found: warn
          path: |
            data/reports/latest-launch-readiness.*
            apps/web/public/data/bundles/manifest.json

  monthly-coverage:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.job == 'all' || github.event.inputs.job == 'monthly-coverage')) ||
      github.event.schedule == '47 12 1 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Run monthly cruise-line coverage report
        run: pnpm run data:automation:monthly
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cruisekit-monthly-coverage-report
          path: data/reports/
