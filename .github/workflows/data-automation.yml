name: CruiseKit Data Automation

on:
  workflow_dispatch:
  schedule:
    # Daily data health, link, image, and manual-review reports.
    - cron: "21 10 * * *"
    # Weekly report-only cruise-line ingest pass.
    - cron: "34 11 * * 1"
    # Monthly cruise-line coverage report.
    - cron: "47 12 1 * *"

permissions:
  contents: read

jobs:
  daily:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '21 10 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Run daily data automation
        run: pnpm run data:automation:daily
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cruisekit-daily-data-reports
          path: data/reports/

  weekly-ingest:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '34 11 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browser
        run: pnpm exec playwright install chromium
      - name: Run weekly ingest report-only pass
        run: pnpm run data:ingest:weekly-report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cruisekit-weekly-ingest-reports
          path: |
            data/reports/
            data/ingest/reports/

  monthly-coverage:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '47 12 1 * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Run monthly cruise-line coverage report
        run: pnpm run data:automation:monthly
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cruisekit-monthly-coverage-report
          path: data/reports/
